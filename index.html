<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="app.css" />
    <title>To-Do List</title>
  </head>
  <body>
    <main class="app">
      <div class="app-header">
        <h1>To-Do List</h1>
        <button id="themeToggle" type="button" aria-label="Switch to dark mode">🌙 Dark mode</button>
      </div>

      <div class="input-row">
        <input id="taskInput" type="text" placeholder="Add a new task..." aria-label="Add a new task" />
        <input id="taskDate" type="date" aria-label="Task due date" />
        <button id="addBtn" type="button">Add</button>
      </div>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>

      <div class="stats">
        <span id="taskCount">0 tasks</span>
        <button class="clear-btn" id="clearCompletedBtn" type="button">Clear completed</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
